/* ── GLOBAL EFFECTS ────────────────────────────────────────────── */
function Cursor(){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;let cx=0,cy=0,tx=0,ty=0,raf;
    const mv=e=>{tx=e.clientX;ty=e.clientY;if(!el.classList.contains('on'))el.classList.add('on')};
    const mo=e=>{if(e.target.closest('a,button,.cm,.tcard'))el.classList.add('grow');else el.classList.remove('grow')};
    const mt=e=>{if(e.target.closest('a,button,.cm,.tcard')&&!e.relatedTarget?.closest('a,button,.cm,.tcard'))el.classList.remove('grow')};
    const loop=()=>{cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;el.style.transform=`translate(${cx-7}px,${cy-7}px)`;raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);
    document.addEventListener('mousemove',mv,{passive:true});document.addEventListener('mouseover',mo);document.addEventListener('mouseout',mt);
    return()=>{cancelAnimationFrame(raf);document.removeEventListener('mousemove',mv);document.removeEventListener('mouseover',mo);document.removeEventListener('mouseout',mt)};
  },[]);
  return <div ref={ref} id="cur"/>;
}
function Prog(){
  const ref=useRef(null);
  useEffect(()=>{const el=ref.current;if(!el)return;let st=0,tk=false;
    const sc=()=>{if(!tk){requestAnimationFrame(()=>{const h=document.documentElement,sh=h.scrollHeight-h.clientHeight,sp=sh>0?window.scrollY/sh*100:0;if(Math.abs(sp-st)>.5){el.style.width=sp+'%';st=sp}tk=false});tk=true}};
    window.addEventListener('scroll',sc,{passive:true});return()=>window.removeEventListener('scroll',sc);
  },[]);
  return <div ref={ref} id="prog"/>;
}

/* ── CONTACT ───────────────────────────────────────────────────── */
function Contact(){
  const[msg,setMsg]=useState({text:'',ok:false,show:false});const[busy,setBusy]=useState(false);
  const FB='anxionsystem@gmail.com';
  const onSubmit=useCallback(e=>{
    e.preventDefault();const fd=new FormData(e.target);if(fd.get('hp')){e.target.reset();return}
    const name=(fd.get('name')||'').trim(),email=(fd.get('email')||'').trim();
    const show=(t,ok)=>setMsg({text:t,ok,show:true});
    if(name.length<2||name.length>80){show('Enter a valid name.',false);return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){show('Enter a valid email.',false);return}
    fd.delete('hp');setBusy(true);show('Opening email client...',true);
    const body=[...fd.entries()].filter(([,v])=>String(v).trim()).map(([k,v])=>`${k}: ${v}`).join('\n');
    window.location.href=`mailto:${FB}?subject=${encodeURIComponent('Enquiry — '+name)}&body=${encodeURIComponent(body)}`;
    setBusy(false);e.target.reset();setTimeout(()=>setMsg(m=>({...m,show:false})),5000);
  },[]);
  const inp="w-full bg-transparent py-2.5 text-sm text-white placeholder-white/40 focus:outline-none focus:border-brand transition-colors font-mono";
  return(
    <section id="contact" className="py-24 lg:py-36" style={{background:'#000',borderTop:'var(--bw) solid rgba(255,255,255,.15)'}}>
      <div className="mx-auto px-6 lg:px-10" style={{maxWidth:1400}}>
        <div className="grid lg:grid-cols-12 gap-12">
          <div className="lg:col-span-5">
            <Rv tag="span" className="t-label-dk mb-5 block">[ 005 — CONTACT ]</Rv>
            <Rv delay="d1" tag="h2" className="text-3xl lg:text-5xl font-black tracking-tight text-white mb-5">LET'S TALK.</Rv>
            <Rv delay="d2" tag="p" className="t-body-dk text-sm mb-10"><span className="t-lead-dk">Network audit or full cloud migration —</span> our solutions architects are ready.</Rv>
            <Rv delay="d3" tag="div" className="space-y-6">
              <div><p className="t-label-dk mb-1">EMAIL</p><p><a href="mailto:anxionsystem@gmail.com" className="t-body-dk text-xs font-mono hover:text-[var(--accent)] transition-colors">anxionsystem@gmail.com</a></p></div>
              <div><p className="t-label-dk mb-1">PHONE</p><p><a href="tel:+13435405558" className="t-body-dk text-xs font-mono hover:text-brand transition-colors">+13435405558</a></p></div>
              <div><p className="t-label-dk mb-1">LOCATION</p><p className="t-body-dk text-xs font-mono">ANXION SOLUTIONS</p></div>
              <div><p className="t-label-dk mb-2">SOCIAL</p>
                <div className="flex gap-2">
                  {[['linkedin','LinkedIn'],['twitter','Twitter'],['youtube','YouTube'],['github','GitHub']].map(([n,l])=><a key={n} href="#" className="w-9 h-9 flex items-center justify-center text-white/60 hover:text-brand transition-colors" style={{border:'var(--bw) solid rgba(255,255,255,.2)'}} aria-label={l}><Ic n={n} s={14}/></a>)}
                </div>
              </div>
            </Rv>
          </div>
          <div className="lg:col-span-6 lg:col-start-7">
            <Rv delay="d2" tag="form" onSubmit={onSubmit} className="space-y-5" noValidate>
              <div className="grid grid-cols-2 gap-5">
                <div><label htmlFor="fn" className="t-label-dk mb-1 block">NAME</label><input id="fn" name="name" type="text" required maxLength={80} autoComplete="name" className={inp} placeholder="Full name" style={{borderBottom:'var(--bw) solid rgba(255,255,255,.2)'}}/></div>
                <div><label htmlFor="fe" className="t-label-dk mb-1 block">EMAIL</label><input id="fe" name="email" type="email" required maxLength={120} autoComplete="email" className={inp} placeholder="you@company.com" style={{borderBottom:'var(--bw) solid rgba(255,255,255,.2)'}}/></div>
              </div>
              <input type="text" name="hp" tabIndex="-1" autoComplete="off" aria-hidden="true" className="hidden"/>
              <div className="grid grid-cols-2 gap-5">
                <div><label htmlFor="fp" className="t-label-dk mb-1 block">PHONE</label><input id="fp" name="phone" type="tel" maxLength={20} autoComplete="tel" className={inp} placeholder="+13435405558" style={{borderBottom:'var(--bw) solid rgba(255,255,255,.2)'}}/></div>
                <div><label htmlFor="fs" className="t-label-dk mb-1 block">SERVICE</label><select id="fs" name="program" required className={inp+" appearance-none cursor-pointer"} style={{borderBottom:'var(--bw) solid rgba(255,255,255,.2)'}}><option value="" className="bg-black">SELECT</option>{SVCS.map(s=><option key={s.title} className="bg-black">{s.title}</option>)}<option className="bg-black">ENTERPRISE / CUSTOM</option></select></div>
              </div>
              <div><label htmlFor="fm" className="t-label-dk mb-1 block">MESSAGE</label><textarea id="fm" name="message" rows="3" maxLength={1000} className={inp+" resize-none"} placeholder="Describe your infrastructure needs..." style={{borderBottom:'var(--bw) solid rgba(255,255,255,.2)'}}/></div>
              <button type="submit" disabled={busy} className="bf text-xs font-mono tracking-widest px-9 py-3.5 mt-1 disabled:opacity-50">SEND MESSAGE <Ic n="aur" s={14}/></button>
              {msg.show&&<p role="status" aria-live="polite" className={`text-sm font-mono font-bold mt-2 ${msg.ok?'text-brand':'text-red-500'}`}>{msg.text}</p>}
            </Rv>
          </div>
        </div>
      </div>
    </section>
  );
}
