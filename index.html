function useLineInView(){

function useCounter(target,suffix='',threshold=.3){
  const ref=useRef(null);const[val,setVal]=useState(0);

    const el=ref.current;if(!el)return;

  },[target,suffix,threshold]);
  return[ref,val.toLocaleString()+suffix];
}

/*  GLOBAL EFFECTS  */
function Cursor(){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;let cx=0,cy=0,tx=0,ty=0,raf;
    const mv=e=>{tx=e.clientX;ty=e.clientY;if(!el.classList.contains('on'))el.classList.add('on')};
    const mo=e=>{if(e.target.closest('a,button,.cm,.tcard'))el.classList.add('grow');else el.classList.remove('grow')};
    const mt=e=>{if(e.target.closest('a,button,.cm,.tcard')&&!e.relatedTarget?.closest('a,button,.cm,.tcard'))el.classList.remove('grow')};
    const loop=()=>{cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;el.style.transform=`translate(${cx-7}px,${cy-7}px)`;raf=requestAnimationFrame(loop)};
    raf=requestAnimationFrame(loop);
    document.addEventListener('mousemove',mv,{passive:true});document.addEventListener('mouseover',mo);document.addEventListener('mouseout',mt);
    return()=>{cancelAnimationFrame(raf);document.removeEventListener('mousemove',mv);document.removeEventListener('mouseover',mo);document.removeEventListener('mouseout',mt)};
  },[]);
  return <div ref={ref} id="cur" className="custom-cursor-box"/>;
}
function Prog(){
  const ref=useRef(null);
  useEffect(()=>{const el=ref.current;if(!el)return;let st=0,tk=false;
    const sc=()=>{if(!tk){requestAnimationFrame(()=>{const h=document.documentElement,sh=h.scrollHeight-h.clientHeight,sp=sh>0?window.scrollY/sh*100:0;if(Math.abs(sp-st)>.5){el.style.width=sp+'%';st=sp}tk=false});tk=true}};
    window.addEventListener('scroll',sc,{passive:true});return()=>window.removeEventListener('scroll',sc);
  },[]);
  return <div ref={ref} id="prog"/>;
}

/*  CONTACT  */
function Contact(){
  const[msg,setMsg]=useState({text:'',ok:false,show:false});const[busy,setBusy]=useState(false);
  const FB='anxionsystem@gmail.com';
  const onSubmit=useCallback(e=>{
    e.preventDefault();const fd=new FormData(e.target);if(fd.get('hp')){e.target.reset();return}
    const name=(fd.get('name')||'').trim(),email=(fd.get('email')||'').trim();
    const show=(t,ok)=>setMsg({text:t,ok,show:true});
    if(name.length<2||name.length>80){show('Enter a valid name.',false);return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){show('Enter a valid email.',false);return}
    fd.delete('hp');setBusy(true);show('Opening email client...',true);
    const body=[...fd.entries()].filter(([,v])=>String(v).trim()).map(([k,v])=>`${k}: ${v}`).join('\n');
    window.location.href=`mailto:${FB}?subject=${encodeURIComponent('Enquiry  '+name)}&body=${encodeURIComponent(body)}`;
    setBusy(false);e.target.reset();setTimeout(()=>setMsg(m=>({...m,show:false})),5000);
  },[]);
  const inp="w-full font-mono bg-[var(--card)] backdrop-blur-2xl border border-[var(--border)] rounded-lg px-6 py-4 text-base text-[var(--fg)] placeholder:text-[var(--fg)] placeholder:opacity-40 focus:outline-none focus:border-[var(--accent)] focus:ring-1 focus:ring-[var(--accent)] transition-all duration-300 shadow-sm";
  return(
    <section id="contact" className="py-24 lg:py-36 bg-[var(--bg)] border-t border-[var(--border)]">
      <div className="mx-auto px-6 lg:px-10 w-full max-w-[1400px]">
        <div className="grid lg:grid-cols-12 gap-16">
          <div className="lg:col-span-5">
            <Rv tag="div" className="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-[var(--card)] bg-opacity-80 backdrop-blur-md border border-[var(--border)] mb-8 shadow-sm dark:shadow-none"><div className="w-1.5 h-1.5 rounded-full bg-[var(--accent)] animate-pulse"></div><span className="text-xs font-black tracking-[0.3em] text-[var(--accent)] uppercase">Contact</span></Rv>
            <Rv delay="d1" tag="h2" className="text-3xl lg:text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-[var(--fg)] to-[var(--fg-muted)] drop-shadow-sm mb-5">LET'S TALK.</Rv>
            <Rv delay="d2" tag="p" className="t-body-dk text-sm mb-10"><span className="t-lead-dk">Network audit or full cloud migration </span> our solutions architects are ready.</Rv>
            <Rv delay="d3" tag="div" className="space-y-6">
              <div><p className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-2 block font-mono">EMAIL</p><p><a href="mailto:anxionsystem@gmail.com" className="text-lg font-mono text-[var(--fg)] tracking-wide hover:text-[var(--accent)] transition-colors">anxionsystem@gmail.com</a></p></div>
              <div><p className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-2 block font-mono">PHONE</p><p><a href="tel:+13435405558" className="text-lg font-mono text-[var(--fg)] tracking-wide hover:text-[var(--accent)] transition-colors">+13435405558</a></p></div>
              <div><p className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-2 block font-mono">LOCATION</p><p className="text-lg font-mono text-[var(--fg)] tracking-wide">ANXION SOLUTIONS</p></div>
              <div><p className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-2 block font-mono">SOCIAL</p>
                <div className="flex gap-2">
                  {[['linkedin','LinkedIn'],['twitter','Twitter'],['youtube','YouTube'],['github','GitHub']].map(([n,l])=><a key={n} href="#" className="w-9 h-9 flex items-center justify-center text-[var(--fg-muted)] hover:text-brand transition-colors" style={{border:'var(--bw) solid var(--border)'}} aria-label={l}><Ic n={n} s={14}/></a>)}
                </div>
              </div>
            </Rv>
          </div>
          <div className="lg:col-span-6 lg:col-start-7">
            <Rv delay="d2" tag="form" onSubmit={onSubmit} className="space-y-5" noValidate>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label htmlFor="fn" className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-3 block font-mono uppercase">NAME</label><input id="fn" name="name" type="text" required maxLength={80} autoComplete="name" className={inp} placeholder="Full name"/></div>
                <div><label htmlFor="fe" className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-3 block font-mono uppercase">EMAIL</label><input id="fe" name="email" type="email" required maxLength={120} autoComplete="email" className={inp} placeholder="you@company.com"/></div>
              </div>
              
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div><label htmlFor="fp" className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-3 block font-mono uppercase">PHONE</label><input id="fp" name="phone" type="tel" maxLength={20} autoComplete="tel" className={inp} placeholder="+13435405558"/></div>
                <div><label htmlFor="fs" className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-3 block font-mono uppercase">SERVICE</label><select id="fs" name="program" required className={inp+" appearance-none cursor-pointer"}><option value="" className="bg-[var(--card)]">SELECT</option>{SVCS.map(s=><option key={s.title} className="bg-[var(--card)]">{s.title}</option>)}<option className="bg-[var(--card)]">ENTERPRISE / CUSTOM</option></select></div>
              </div>
              <div><label htmlFor="fm" className="text-xs font-black tracking-[0.3em] text-[var(--fg-muted)] mb-3 block font-mono uppercase">MESSAGE</label><textarea id="fm" name="message" rows="3" maxLength={1000} className={inp+" resize-none min-h-[120px]"} placeholder="Describe your infrastructure needs..."/></div>
              <button type="submit" disabled={busy} className="bf font-mono w-full py-5 text-sm md:text-base font-black tracking-[0.4em] uppercase rounded-md mt-4 flex items-center justify-center gap-4  disabled:opacity-50">SEND MESSAGE <span className="flex items-center mt-[-2px]"><Ic n="aur" s={18}/></span></button>
              {msg.show&&<p role="status" aria-live="polite" className={`text-sm font-mono font-bold mt-2 ${msg.ok?'text-brand':'text-red-500'}`}>{msg.text}</p>}
            </Rv>
          </div>
        </div>
      </div>
    </section>
  );
}

/*  FOOTER  */
function Footer(){
  return(
    <footer className="bg-[var(--bg)] border-t border-[var(--border)] py-8">
      <div className="mx-auto px-6 lg:px-10 flex flex-col sm:flex-row items-center justify-between gap-4 w-full max-w-[1400px]">
        <Logo size={20} dark={true}/>
        <div className="flex items-center gap-5">{NAV.map(l=><a key={l.id} href={`#${l.id}`} className="text-xs font-mono font-bold text-[var(--fg-muted)] hover:text-[var(--fg)] tracking-wider transition-colors">{l.label}</a>)}</div>
        <p className="t-label-dk" style={{fontSize:9}}>&copy; 2026 ANXION SOLUTIONS</p>
      </div>
    </footer>
  );
}

/*  APP  */
function App(){
  return(
    <>
      <div className="pointer-events-none fixed inset-0 z-50 opacity-[0.03]" style={{backgroundImage:'url("data:image/svg+xml,%3Csvg viewBox=%270 0 200 200%27 xmlns=%27http://www.w3.org/2000/svg%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%270.65%27 numOctaves=%273%27 stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")'}} />
      <div className="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
          <div className="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-[var(--accent)] opacity-30 dark:opacity-[0.15] blur-[150px] mix-blend-screen animate-pulse" style={{animationDuration: '12s'}}></div>
          <div className="absolute top-[50%] -right-[10%] w-[70%] h-[70%] rounded-full bg-blue-500 opacity-30 dark:opacity-[0.15] blur-[180px] mix-blend-screen animate-pulse" style={{animationDuration: '15s', animationDelay: '2s'}}></div>
          <div className="absolute top-[30%] left-[20%] w-[60%] h-[40%] rounded-[100%] bg-indigo-500 opacity-20 dark:opacity-[0.10] blur-[120px] mix-blend-screen transform rotate-12"></div>
        </div>
      <Cursor/><Prog/><Navbar/><Hero/><Marquee/><About/><Services/><Divider/><Stats/><Testimonials/><Divider/><Team/><Partners/><CTA/><Contact/><Footer/>
    </>
  );
}

/*  MOUNT  */
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
const hl=()=>{const l=document.getElementById('loader');if(l)l.classList.add('done')};
window.addEventListener('load',()=>setTimeout(hl,350));
document.addEventListener('DOMContentLoaded',()=>setTimeout(hl,2000));
</script>
</body>
</html>
